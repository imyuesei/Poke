name: Build Poke APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch the Cactus engine for android-arm64
        run: |
          pip install --quiet cactus-compute
          cactus download android-arm64 --out poke/src/main/cpp/cactus
          ls -la poke/src/main/cpp/cactus/android-arm64
          find poke/src/main/cpp/cactus -name "*.h" -exec head -80 {} \;

      - name: Fetch and prepare eSpeak NG
        run: |
          git clone --quiet --depth 1 --branch 1.52.0 https://github.com/espeak-ng/espeak-ng poke/src/main/cpp/espeak-ng
          # its phoneme data and English dictionary are compiled with a native build
          cmake -S poke/src/main/cpp/espeak-ng -B /tmp/espeak-native -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF \
            -DUSE_LIBPCAUDIO=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build /tmp/espeak-native -j4 --target data > /dev/null
          D=/tmp/espeak-native/espeak-ng-data
          A=poke/src/main/assets/espeak-ng-data
          mkdir -p $A/lang/gmw $A/voices
          cp $D/phontab $D/phonindex $D/phondata $D/intonations $D/en_dict $A/
          cp $D/lang/gmw/en* $A/lang/gmw/
          cp -r "$D/voices/!v" $A/voices/
          du -sh $A

      - name: Build APK
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew :poke:assembleRelease --no-daemon && break
            echo "Build attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          cp poke/build/outputs/apk/release/poke-release.apk poke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poke
          path: poke.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((200 + ${{ github.run_number }}))
          # the old Notch Eyes release used the tag "latest"; drop it so it can't shadow Poke
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v$CODE" poke.apk \
            --target "${{ github.sha }}" \
            --title "Poke 1.0.$CODE" \
            --latest \
            --notes "Poke 1.0.$CODE. Poke updates itself; to install by hand, download poke.apk below."
