name: Build Poke APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew :poke:assembleRelease --no-daemon && break
            echo "Build attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          cp poke/build/outputs/apk/release/poke-release.apk poke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: poke
          path: poke.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((200 + ${{ github.run_number }}))
          # the old Notch Eyes release used the tag "latest"; drop it so it can't shadow Poke
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v$CODE" poke.apk \
            --target "${{ github.sha }}" \
            --title "Poke 1.0.$CODE" \
            --latest \
            --notes "Poke 1.0.$CODE. Poke updates itself; to install by hand, download poke.apk below."
